{{- $fullname := include "kubevalet.fullname" . }}
{{- $ns      := .Release.Namespace }}

{{- /*
Deterministic instead of random: derived from namespace+release+purpose, so it comes out
identical on every render without relying on Helm `lookup` (which needs live cluster access
and returns nothing under client-side renderers like Argo CD's default `helm template`,
which would otherwise mint a new value on every sync and desync Postgres from the app).
*/}}
{{- $jwtSecret := .Values.auth.jwtSecret }}
{{- if not $jwtSecret }}
  {{- $jwtSecret = sha256sum (printf "%s/%s/jwt" $ns $fullname) | trunc 32 }}
{{- end }}

{{- $pgPassword := .Values.postgres.password }}
{{- if not $pgPassword }}
  {{- $pgPassword = sha256sum (printf "%s/%s/postgres" $ns $fullname) | trunc 24 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubevalet.labels" . | nindent 4 }}
type: Opaque
{{- $postgresDSN := "" }}
{{- if .Values.postgres.enabled }}
  {{- $postgresDSN = printf "postgres://%s:%s@%s:5432/%s?sslmode=disable"
      .Values.postgres.user $pgPassword
      (include "kubevalet.postgresHost" .) .Values.postgres.database }}
{{- else }}
  {{- $postgresDSN = required "postgres.external.dsn is required when postgres.enabled is false" .Values.postgres.external.dsn }}
{{- end }}
stringData:
  POSTGRES_DSN:      {{ $postgresDSN | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  JWT_SECRET:        {{ $jwtSecret | quote }}
  ADMIN_PASSWORD:    {{ .Values.auth.adminPassword | quote }}
